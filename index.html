<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://tzbjikrnvphbbwfxjxdv.supabase.co; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'self'">
<title>The Boardroom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ground: #EDECE6; --sheet: #FFFFFF; --ink: #0A0A0A; --ink2: #6B6B66; --ink3: #9A9A93;
    --line: #EFEEE8; --line2: #E3E2DB; --track: #EFEEE8; --accent: #FBF000; --frame: #E2E1DA;
    --shadow: 0 1px 2px rgba(20,20,10,0.06), 0 6px 18px rgba(20,20,10,0.06);
    --shadow-hi: 0 1px 2px rgba(20,20,10,0.06), 0 10px 28px rgba(20,20,10,0.10);
    --ease: cubic-bezier(0.32, 0.72, 0, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --font: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--frame); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }
  p { margin: 0; }

  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 40px 24px; }
  .phone { width: 390px; height: 844px; background: var(--ground); border-radius: 44px; box-shadow: 0 30px 80px rgba(20, 20, 10, 0.20), 0 2px 0 rgba(255,255,255,0.7) inset; overflow: hidden; position: relative; flex-shrink: 0; }
  .screen { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
  @media (max-width: 560px) {
    body { background: var(--ground); }
    .stage { padding: 0; min-height: 100dvh; align-items: stretch; }
    .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* Root views */
  .views { position: absolute; inset: 0; transition: transform 460ms var(--ease), opacity 460ms var(--ease); transform-origin: center 40%; }
  .views.pushed { transform: scale(0.96); opacity: 0.55; }
  .view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 0 0 110px 0; display: none; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }
  .view.on { display: block; }
  .view.enter { animation: viewIn 300ms var(--ease-out) both; }
  .view.exit { animation: viewOut 160ms ease both; pointer-events: none; }
  @keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes viewOut { from { opacity: 1; } to { opacity: 0; } }
  .reveal { animation: rise 560ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }

  /* Common */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 26px 22px 0 22px; min-height: 60px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink2); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .pad { padding-left: 22px; padding-right: 22px; }
  .head { padding-top: 24px; display: flex; flex-direction: column; gap: 6px; }
  .h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.2; text-wrap: balance; }
  .h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25; }
  .h3 { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .sub { font-size: 14px; color: var(--ink2); }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2); }
  .muted { color: var(--ink2); }
  .faint { color: var(--ink3); }
  .small { font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 12px; padding-top: 20px; }
  .sheet { position: relative; background: var(--sheet); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
  .sheet.hi { box-shadow: var(--shadow-hi); }
  .sheet.dark { background: var(--ink); color: #F2F1EA; }
  .sheet.dark .label { color: var(--accent); }
  .sheet.list { padding: 6px 18px; gap: 0; }
  .sheet > .ixt + div { padding-right: 40px; }
  .ixt { position: absolute; top: -1px; right: 22px; width: 26px; height: 18px; background: var(--accent); border: 1px solid var(--ink); border-top: 0; border-radius: 0 0 4px 4px; }
  button.sheet { transition: transform 200ms var(--ease-out), box-shadow 200ms; }
  button.sheet:active { transform: scale(0.99); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .row:first-of-type { border-top: 0; }
  .row .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row .l b { font-weight: 500; font-size: 14px; line-height: 1.4; }
  .row .l span { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row svg { flex-shrink: 0; }
  .row:hover .l b { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .btn { display: flex; align-items: center; justify-content: center; height: 46px; width: 100%; background: var(--ink); color: #FFFFFF; font-weight: 600; font-size: 13px; border-radius: 6px; transition: transform 160ms var(--ease-out), background 160ms; }
  .btn:active { transform: scale(0.985); }
  .btn.accent { background: var(--accent); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.done { background: var(--ground); color: var(--ink2); }
  .link { color: var(--ink); font-weight: 600; font-size: 13px; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; min-height: 40px; display: inline-flex; align-items: center; }
  .quiet-link { color: var(--ink); font-size: 12px; font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; }
  .quiet-link:hover { text-decoration: underline; }
  .sq { display: inline-block; width: 9px; height: 9px; background: var(--accent); border: 1px solid var(--ink); flex-shrink: 0; }
  .sq.off { background: transparent; border-color: var(--ink3); }
  .sq.done { background: var(--ink); border-color: var(--ink); }
  .quote { display: flex; gap: 14px; align-items: flex-start; padding-top: 22px; }
  .quote i { width: 2px; align-self: stretch; background: var(--ink); flex-shrink: 0; }
  .quote .q { font-size: 14px; line-height: 1.55; font-weight: 500; }
  .foot { padding: 28px 0 0 0; font-size: 12px; color: var(--ink3); }

  /* Brief */
  .bi .n { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--ink2); }
  .bi .t { font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
  .bi .w { font-size: 14px; color: var(--ink2); line-height: 1.55; }
  .bi .act { margin-top: 6px; }

  .pri { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .pri:first-of-type { border-top: 0; }
  .pri .n { font-size: 11px; font-weight: 600; color: var(--ink3); width: 18px; flex-shrink: 0; padding-top: 3px; }
  .pri .t { font-size: 14px; font-weight: 500; line-height: 1.5; }

  /* Commitments */
  .chips { display: flex; gap: 8px; padding-top: 18px; }
  .chip { height: 34px; padding: 0 16px; display: flex; align-items: center; border-radius: 17px; background: var(--sheet); font-size: 12px; font-weight: 500; color: var(--ink2); box-shadow: 0 1px 2px rgba(20,20,10,0.06); transition: background 220ms, color 220ms; }
  .chip.on { background: var(--ink); color: #FFFFFF; font-weight: 600; }
  .cs { flex-direction: row; gap: 14px; align-items: flex-start; }
  .cs.dim .text { color: var(--ink2); }
  .check { width: 44px; height: 44px; margin: -11px 0 -11px -11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check .box { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: background 220ms var(--ease-out), border-color 220ms; }
  .check.parked .box { border-style: dashed; border-color: var(--ink3); }
  .check svg { opacity: 0; transition: opacity 1ms linear 80ms; }
  .check svg path { stroke: var(--ink); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 260ms var(--ease-out) 80ms; }
  .check.on svg { opacity: 1; transition-delay: 0ms; }
  .check.on .box { background: var(--accent); border-color: var(--ink); border-style: solid; }
  .check.on svg path { stroke-dashoffset: 0; }
  .cs .body { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; text-align: left; }
  .cs .text { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .cs .meta { font-size: 13px; color: var(--ink2); }
  .cs .meta b { font-weight: 600; color: var(--ink); }
  .cs .body:hover .text { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .cs.collapse { overflow: hidden; max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; margin-top: -12px; }
  .cs { transition: max-height 320ms var(--ease), opacity 240ms ease, padding 320ms var(--ease), margin 320ms var(--ease); max-height: 240px; }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink2); border: 1px solid var(--line2); padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .add { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; font-size: 14px; font-weight: 600; }
  .add .plus { width: 28px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .add:hover .plus { background: var(--accent); }
  .strip { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; margin-top: 14px; padding: 0 16px; background: var(--sheet); border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); }
  .strip .grow { flex-grow: 1; }
  .strip .go { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  /* Sessions and library */
  .seg { display: flex; background: var(--sheet); border-radius: 12px; padding: 4px; box-shadow: 0 1px 2px rgba(20,20,10,0.06); position: relative; margin-top: 18px; }
  .seg button { flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--ink2); position: relative; z-index: 1; transition: color 240ms; }
  .seg button.on { color: #FFFFFF; font-weight: 600; }
  .seg .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--ink); border-radius: 9px; transition: transform 380ms var(--ease); }
  .ss { flex-direction: row; gap: 16px; align-items: flex-start; }
  .ss .date { width: 48px; flex-shrink: 0; display: flex; flex-direction: column; line-height: 1; }
  .ss .date b { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .ss .date span { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--ink2); margin-top: 6px; }
  .ss .d { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
  .ss .t { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .ss .m { font-size: 13px; color: var(--ink2); line-height: 1.5; }
  .ss .due { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; }
  .ss.past .date b, .ss.past .t { color: var(--ink2); }
  .ss:hover .t { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .search { margin-top: 18px; background: var(--sheet); border-radius: 12px; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 1px 2px rgba(20,20,10,0.06); }
  .search input { flex-grow: 1; border: 0; background: transparent; font-size: 15px; outline: none; }
  .search input::placeholder { color: var(--ink3); }
  .new { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-left: 6px; }
  .empty { padding: 30px 0; color: var(--ink3); }
  .prep .pr { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; border-top: 1px solid var(--line); text-align: left; }
  .prep .pr:first-of-type { border-top: 0; }
  .prep .pr .t { font-weight: 500; flex-grow: 1; font-size: 14px; }
  .prep .pr .s { font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .prep .pr.done .t { color: var(--ink3); text-decoration: line-through; text-decoration-color: var(--ink3); }
  .day { display: flex; flex-direction: column; }
  .day > div { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .day > div:first-child { border-top: 0; }
  .day .w { width: 80px; flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink2); padding-top: 4px; }
  .day .x { color: var(--ink2); font-size: 13px; line-height: 1.5; }
  .day .x b { color: var(--ink); font-weight: 600; display: block; font-size: 14px; }

  /* Agenda home */
  .row .num { font-size: 13px; font-weight: 800; color: var(--ink3); width: 30px; flex-shrink: 0; }
  .row .l { flex-grow: 1; }
  .wkrow { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; padding: 6px 0; }
  .wkrow::-webkit-scrollbar { display: none; }
  .wkb { display: flex; align-items: center; gap: 10px; flex-shrink: 0; text-align: left; }
  .wkb .wd { width: 44px; height: 44px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
  .wkb .wd b { font-size: 16px; font-weight: 800; line-height: 1; }
  .wkb .wd i { font-style: normal; font-size: 8px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
  .wkb .wd.bdx { background: var(--accent); border: 1px solid var(--ink); color: var(--ink); }
  .wkb .wd.isx { background: var(--ink); color: #FFFFFF; }
  .wkb .wd.rvx { background: var(--sheet); border: 1.5px dashed var(--ink); color: var(--ink); }
  .wkb .wt { font-size: 12px; font-weight: 600; line-height: 1.3; max-width: 110px; }
  .wkb:hover .wt { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .heroq { width: 36px; height: 36px; flex-shrink: 0; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--ink); }

  /* Year calendar */
  .ycal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; padding-top: 10px; }
  .ym .yl { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--ink2); margin-bottom: 5px; }
  .yg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .yg i, .yg .yd { font-size: 9px; line-height: 1; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; color: var(--ink2); font-style: normal; min-width: 0; }
  .yg i.gone { color: #C9C8C0; }
  .yg .yd { font-weight: 700; color: var(--ink); border-radius: 3px; cursor: pointer; }
  .yd.bd { background: var(--accent); border: 1px solid var(--ink); }
  .yd.is { background: var(--ink); color: #FFFFFF; }
  .yd.rv { background: var(--sheet); border: 1.5px dashed var(--ink); }
  .ykey { display: flex; gap: 14px; padding-top: 12px; font-size: 11px; color: var(--ink2); flex-wrap: wrap; }
  .ykey span { display: flex; align-items: center; gap: 6px; }
  .ykey .k { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .k.bd { background: var(--accent); border: 1px solid var(--ink); }
  .k.is { background: var(--ink); }
  .k.rv { border: 1.5px dashed var(--ink); background: var(--sheet); }

  .brand { display: none; }
  /* Pill nav */
  .pill { position: absolute; left: 12px; right: 12px; bottom: 14px; background: var(--ink); border-radius: 18px; display: flex; padding: 6px; z-index: 4; transition: transform 460ms var(--ease), opacity 460ms var(--ease); box-shadow: 0 12px 30px rgba(20,20,10,0.22); }
  .pill.pushed { transform: translateY(120%); opacity: 0; }
  .pill .ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: 60px; background: var(--accent); border-radius: 12px; transition: transform 420ms var(--ease), width 420ms var(--ease); }
  .tab { position: relative; z-index: 1; flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #B9B9B2; transition: flex-grow 420ms var(--ease), color 240ms; }
  .tab svg { flex-shrink: 0; }
  .tab .lb { font-size: 11px; font-weight: 600; white-space: nowrap; display: none; }
  .tab.on { flex-grow: 2.1; color: var(--ink); }
  .tab.on .lb { display: inline; }
  .tab .dot { position: absolute; top: 12px; right: calc(50% - 14px); width: 6px; height: 6px; background: var(--accent); border-radius: 50%; border: 1px solid var(--ink); }
  .tab.on .dot { display: none; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 100px; background: linear-gradient(to bottom, rgba(237,236,230,0), var(--ground) 60%); pointer-events: none; z-index: 3; }

  /* Layers: sheets that expand */
  .layers { position: absolute; inset: 0; pointer-events: none; }
  .layer { position: absolute; inset: 0; background: var(--ground); opacity: 0; transition: opacity 240ms ease; overflow-y: auto; overflow-x: hidden; pointer-events: auto; scrollbar-width: none; touch-action: pan-y; }
  .layer::-webkit-scrollbar { display: none; }
  .layer.in { opacity: 1; }
  .layer.dragging { transition: none; }
  .gexp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--sheet); border-radius: 10px; transform-origin: top left; transition: transform 460ms var(--ease), border-radius 460ms var(--ease), opacity 200ms ease; z-index: 6; box-shadow: var(--shadow-hi); pointer-events: none; }
  .gexp.full { transform: none !important; border-radius: 0; }
  .gexp.out { opacity: 0; }
  .layer-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 14px 0 10px; }
  .back { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .back:hover { color: var(--ink); }
  .layer .content { padding: 12px 22px 48px 22px; display: flex; flex-direction: column; }
  .prose { display: flex; flex-direction: column; gap: 10px; color: var(--ink2); font-size: 14px; line-height: 1.6; }
  .prose.ink { color: var(--ink); }
  .kv { display: flex; flex-direction: column; }
  .kv div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .kv div:first-child { border-top: 0; }
  .kv div span:first-child { color: var(--ink2); }
  .kv div span:last-child { font-weight: 500; text-align: right; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-weight: 500; font-size: 14px; }
  .field textarea, .field input { width: 100%; border: 0; border-bottom: 1px solid var(--line2); background: transparent; padding: 10px 0; font-size: 15px; resize: none; line-height: 1.5; outline: none; border-radius: 0; }
  .field textarea:focus, .field input:focus { border-bottom-color: var(--ink); box-shadow: 0 2px 0 var(--accent); }
  .hint { font-size: 12px; color: var(--ink3); }
  .seg3 { display: flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .seg3 button { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--ink2); border-right: 1px solid var(--line2); transition: background 200ms, color 200ms; }
  .seg3 button:last-child { border-right: 0; }
  .seg3 button.on { background: var(--ink); color: #FFFFFF; font-weight: 600; }
  .seg3 button.on.accent { background: var(--accent); color: var(--ink); }
  .banner { padding: 10px 14px; border: 1px dashed var(--ink3); border-radius: 6px; font-size: 12px; color: var(--ink2); }
  .stmt { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .stmt:first-child { border-top: 0; }
  .stmt .s { line-height: 1.5; font-size: 14px; }
  .stmt .dots { display: flex; gap: 6px; align-items: center; }
  .stmt .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  .stmt .dots i.on { background: var(--ink); }

  // ---------- Data layer ----------
  function typeLabel(t) { return t === 'boardroom_day' ? 'Boardroom Day' : 'Online, two hours'; }
  function hydrateSession(row) {
    const bd = row.type === 'boardroom_day';

      id: row.id, date: row.session_date, kind: row.type,
      day: dayNum(row.session_date), mon: mon3(row.session_date), long: longDate(row.session_date),

  function attachPrep(sessions) {
    const firstBd = sessions.find((s) => s.upcoming && s.kind === 'boardroom_day');
    const firstIs = sessions.find((s) => s.upcoming && s.kind === 'implementation');
    sessions.forEach((s) => {
      if (!s.upcoming) return;
      const prep = [];
      if (s.kind === 'boardroom_day') {
        const due = addDays(s.date, -7); const opens = addDays(s.date, -21); const packs = addDays(s.date, -3);
        if (firstBd && s.id === firstBd.id && daysUntil(opens) <= 0) {
          prep.push({ id: 'challenge', t: 'Biggest Challenge form', due: due, push: 'challenge' });
          if (daysUntil(packs) >= 0) prep.push({ id: 'preread:' + s.id, t: 'Read the session pack', note: 'Arrives ' + longDate(packs), arrives: packs });
          prep.push({ id: 'review:' + s.id, t: 'Review your open commitments', push: 'tab:commitments' });
        } else {
          prep.push({ id: 'challenge:' + s.id, t: 'Biggest Challenge form', due: due, note: 'Opens ' + longDate(opens) });
        }
      }
      if (s.kind === 'implementation') {
        const due = addDays(s.date, -2); const opens = addDays(s.date, -7);
        if (firstIs && s.id === firstIs.id && daysUntil(opens) <= 0) {
          prep.push({ id: 'tracker:' + s.id, t: 'Progress tracker', due: due });
          prep.push({ id: 'review2:' + s.id, t: 'Update your commitments', push: 'tab:commitments' });
        } else {
          prep.push({ id: 'tracker:' + s.id, t: 'Progress tracker', due: due, note: 'Opens ' + longDate(opens) });
        }

  }
  function hydrateDoc(row) {

    return { id: row.id, cat: row.category, title: row.title, meta: row.meta || '', about: row.about || '', inside: [], link: safeLink, storagePath: row.storage_path || '', isNew: !!row.is_new };
  }
  // Open a stored document via a short lived signed URL. The blank tab is
  // opened synchronously on the click so popup blockers let it through, then
  // pointed at the signed URL once it resolves. Members only ever get a link
  // that lasts a minute; there is no permanent public URL.
  async function openDoc(id) {
    const d = state.docs.find((x) => x.id === id); if (!d) return;
    if (!d.storagePath) { if (d.link) window.open(d.link, '_blank', 'noopener'); return; }
    const w = window.open('', '_blank');
    try {
      const { data, error } = await sb.storage.from('br-docs').createSignedUrl(d.storagePath, 60);
      if (error || !data || !data.signedUrl) { if (w) w.close(); toast('That document would not open. Try again, or ask Joe on WhatsApp.'); return; }
      if (w) { w.location = data.signedUrl; } else { window.open(data.signedUrl, '_blank', 'noopener'); }
    } catch (e) { if (w) w.close(); toast('That document would not open. Try again, or ask Joe on WhatsApp.'); }
  }
  async function loadAll() {
    const [sess, docs, posts, settings, mem, sdocs] = await Promise.all([
      sb.from('br_sessions').select('*').eq('published', true).order('session_date'),
      sb.from('br_documents').select('*').eq('published', true).order('created_at'),
      sb.from('br_posts').select('*').eq('approved', true).order('posted_at', { ascending: false }),
      sb.from('br_settings').select('*'),
      sb.from('br_members').select('*').ilike('email', authEmail),
      sb.from('br_session_docs').select('*').order('sort')
    ]);
    // br_session_docs may not exist yet (migration v2). Treat a missing
    // table as no links rather than a hard failure.
    const sdocsMissing = sdocs.error && /session_docs|does not exist|schema cache/i.test(sdocs.error.message || '');
    const err = [sess, docs, posts, settings, mem].map((r) => r.error).find(Boolean) || (sdocs.error && !sdocsMissing ? sdocs.error : null);
    if (err) throw err;
    const mrow = (mem.data || [])[0] || null;
    me = mrow ? mrow.id : null;
    if (mrow) member = { first: (mrow.name || '').split(' ')[0], name: mrow.name || '', company: mrow.company || '', since: mrow.joined_date ? monthYear(mrow.joined_date) : '', joined: mrow.joined_date || '', email: mrow.email };
    else member = { first: authEmail.split('@')[0], name: authEmail.split('@')[0], company: '', since: '', joined: '', email: authEmail };

    state.sessions.sort((a, b) => parse(a.date) - parse(b.date));
    attachPrep(state.sessions);
    state.docs = (docs.data || []).map(hydrateDoc);
    // Attach the day's documents to each session, grouped by role.
    const docById = {}; state.docs.forEach((d) => { docById[d.id] = d; });
    state.sessions.forEach((s) => { s.sdocs = { summary: [], slides: [], actions: [], extra: [], accountability: [] }; });
    const sessById = {}; state.sessions.forEach((s) => { sessById[s.id] = s; });
    (sdocsMissing ? [] : (sdocs.data || [])).forEach((r) => {
      const s = sessById[r.session_id]; const d = docById[r.document_id];
      if (s && d && s.sdocs[r.role]) s.sdocs[r.role].push(d);
    });
    state.updates = (posts.data || []).map((r) => ({ d: agoWords(r.posted_at), t: r.body }));
    const settingsMap = {}; (settings.data || []).forEach((r) => { settingsMap[r.key] = r.value || {}; });
    state.paused = !!(settingsMap.app && settingsMap.app.paused);
    state.dannyLine = (settingsMap.danny_line && settingsMap.danny_line.t) ? { t: settingsMap.danny_line.t, d: settingsMap.danny_line.d || iso(today()) } : null;
    state.challengeSent = false; state.prepDone = {}; state.notes = {}; state.commitments = [];
    if (me) {
      const [com, prep] = await Promise.all([
        sb.from('br_commitments').select('*').eq('member_id', me).order('created_at', { ascending: false }),
        sb.from('br_prep').select('*').eq('member_id', me)
      ]);
      if (com.error || prep.error) throw (com.error || prep.error);
      state.commitments = (com.data || []).map(hydrateCommitment);
      state.commitments.forEach((c) => { if (c.note) state.notes[c.id] = c.note; });
      const bd = state.sessions.find((s) => s.upcoming && s.kind === 'boardroom_day');
      (prep.data || []).forEach((r) => {
        if (r.kind === 'challenge' && bd && r.session_id === bd.id) state.challengeSent = true;
        if (r.kind === 'tracker' && r.answers && r.answers.item) state.prepDone[r.answers.item] = true;
      });
    }
  }

  // ---------- Sign in gate ----------
  const BRAND_MARK = '<svg width="52" height="26" viewBox="0 0 48 24" fill="none" aria-hidden="true"><path d="M24 12 C28 3.5, 41.5 4, 41.5 12 C41.5 20, 28 20.5, 24 12" stroke="#FBF000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M24 12 C20 3.5, 6.5 4, 6.5 12 C6.5 20, 20 20.5, 24 12" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  let pendingEmail = '';
  function gate(html) { const g = $('#gate'); g.innerHTML = '<div class="inner"><div class="mark">' + BRAND_MARK + '<span>THE BOARDROOM</span></div>' + html + '</div>'; g.classList.add('on'); stagger(g); }
  function hideGate() { const g = $('#gate'); g.classList.remove('on'); g.innerHTML = ''; }
  function gateError(msg) { const el = $('#gateErr'); if (el) { el.textContent = msg; el.hidden = false; } }
  function showAuth() {
    gate('<div class="head reveal" style="padding-top:8px"><div class="h1">Your Boardroom.</div><div class="sub">Sign in with the email on your membership. We email you a link to tap.</div></div>' +
      '<form id="emailForm" class="sheet reveal hi" style="gap:16px"><i class="ixt"></i><div class="field"><label for="ge">Email</label><input id="ge" type="email" required autocomplete="email" inputmode="email" placeholder="you@company.com"></div><div class="err" id="gateErr" hidden></div><button class="btn" type="submit" id="gateBtn">Email me a link</button></form>' +
      '<div class="hint reveal">Stuck? Message Joe on WhatsApp, as usual.</div>' +
      '<div class="foot" style="padding:0">The Ultimate Founder Boardroom</div>');
    setTimeout(() => { const f = $('#ge'); if (f) f.focus(); }, 220);
  }
  function showCode() {
    gate('<div class="head reveal" style="padding-top:8px"><div class="h1">Check your email.</div><div class="sub">We have sent a sign in link to ' + esc(pendingEmail) + '. Open your email on this device and tap the link. You are then signed in.</div></div>' +
      '<div class="sheet reveal hi"><i class="ixt"></i><div style="display:flex; gap:12px; align-items:flex-start"><span class="sq" style="margin-top:5px"></span><div style="font-size:14px; line-height:1.55">The email is from The Ultimate Founder. If it is not there in a minute, check your junk folder, or message Joe on WhatsApp.</div></div></div>' +
      // A code entry is kept ready for when the team turns on six digit codes; hidden while the email sends a link only.
      '<button class="quiet-link reveal" data-code-toggle style="display:none">Enter a code instead</button>' +
      '<form id="codeForm" class="sheet reveal" style="gap:16px; display:none"><div class="field"><label for="gc">Code</label><input id="gc" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:6px; font-size:22px"></div><div class="err" id="gateErr" hidden></div><button class="btn" type="submit" id="gateBtn">Sign in</button></form>' +
      '<button class="quiet-link reveal" data-gate-back>Use a different email</button>');
  }
  function showNotMember() {
    gate('<div class="head reveal" style="padding-top:8px"><div class="h1">This app is for Boardroom members.</div><div class="sub">If you think you should be here, message Joe on WhatsApp.</div></div>' +
      '<button class="quiet-link reveal" data-signout>Use a different email</button>');
  }

  // ---------- Boot ----------
  let booted = false, refreshing = false, entering = false, lastLoad = 0;
  async function enter(email) {
    if (entering) return; entering = true;
    authEmail = (email || '').toLowerCase();
    try { await loadAll(); } catch (err) {
      entering = false;
      gate('<div class="head reveal" style="padding-top:8px"><div class="h1">We could not load your Boardroom.</div><div class="sub">Check your signal and try again, or message Joe on WhatsApp.</div></div><button class="btn reveal" data-gate-retry>Try again</button>');
      const rb = $('[data-gate-retry]'); if (rb) rb.addEventListener('click', () => enter(authEmail));
      return;
    }
    lastLoad = Date.now();
    if (!me && !isTeam(authEmail)) { entering = false; showNotMember(); return; }
    hideGate();
    showTab(state.tab || 'home', !booted);
    settleInd();
    if (!booted) { booted = true; logActivity('sign_in', {}); setTimeout(openWelcome, reduced ? 100 : 900); }
    entering = false;
  }
  async function refresh() {
    if (!booted || !sb || refreshing) return;
    if (Date.now() - lastLoad < 60000) return;
    refreshing = true;
    try { await loadAll(); lastLoad = Date.now(); renderers[state.tab](); if (layers.length) refreshLayer(layers[layers.length - 1]); setDot(); } catch (err) {}
    refreshing = false;
  }
  async function boot() {
    if (!sb) { showAuth(); setTimeout(() => gateError('The connection did not start. Refresh the page, or message Joe on WhatsApp.'), 300); return; }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { location.reload(); return; }
      if (event === 'SIGNED_IN' && !booted && !entering && session && session.user) enter(session.user.email);
    });
    let session = null;
    try { const r = await sb.auth.getSession(); session = r.data ? r.data.session : null; } catch (err) {}
    if (session && session.user) enter(session.user.email); else if (location.hash.indexOf('access_token') < 0) showAuth();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  settleInd();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settleInd);
  window.addEventListener('resize', settleInd);
  boot();
})();
</script>
